name: Build AAB Oficial
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: yes | sdkmanager --licenses || true
      - name: Create
        run: |
          rm -rf app build
          mkdir -p app/src/main/java/com/plimclip/oficial
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle << 'END
          plugins { id 'com.android.application' version '8.7.3' }
          android {
            namespace 'com.plimclip.oficial'
            compileSdk 34
            defaultConfig {
              applicationId "com.plimclip.oficial"
              minSdk 24
              targetSdk 34
              versionCode 8
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          END
          cat > app/src/main/AndroidManifest.xml << 'END
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Plim Clip">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          END
          cat > app/src/main/java/com/plimclip/oficial/MainActivity.java << 'END
          package com.plimclip.oficial;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              TextView t=new TextView(this);
              t.setText("Plim Clip Oficial");
              setContentView(t);
            }
          }
          END
          echo '<resources><string name="app_name">Plim Clip</string></resources>' > app/src/main/res/values/strings.xml
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
      - run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aab-oficial
          path: app/build/outputs/bundle/release/app-release.aab
