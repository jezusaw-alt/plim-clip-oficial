name: Gerar AAB real do Plim Clip

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar código completo do Plim Clip
        run: |
          curl -L \
            "https://files.manuscdn.com/user_upload_by_module/session_file/310519663932141451/lpQoZaRHDUsOMtYd.zip" \
            -o plimclip-source.zip

          unzip -q plimclip-source.zip
          cp -R plimclip/. .
          rm -rf plimclip plimclip-source.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        run: pnpm check

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --no-install

      - name: Criar chave temporária de assinatura
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$GITHUB_WORKSPACE/plimclip-upload-key.p12" \
            -alias plimclip \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass plimclip123 \
            -keypass plimclip123 \
            -dname "CN=Plim Clip Oficial, OU=Mobile, O=Plim Clip, L=Brasil, ST=SP, C=BR"

      - name: Configurar assinatura do Release
        run: |
          cat > android/keystore.properties <<'EOF'
          storeFile=/home/runner/work/plim-clip-oficial/plim-clip-oficial/plimclip-upload-key.p12
          storePassword=plimclip123
          keyAlias=plimclip
          keyPassword=plimclip123
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          android {
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          }
          '''

          text = text.replace(
              "android {",
              signing + "\nandroid {",
              1
          )

          text = text.replace(
              "buildTypes {",
              "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n",
              1
          )

          path.write_text(text)
          PY

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar Android App Bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Validar AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Enviar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Plim-Clip-Oficial-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Enviar chave de assinatura para guardar
        uses: actions/upload-artifact@v4
        with:
          name: Plim-Clip-Oficial-Chave-de-Assinatura
          path: plimclip-upload-key.p12
          if-no-files-found: error
