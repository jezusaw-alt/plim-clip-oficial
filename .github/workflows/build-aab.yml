name: Build AAB Oficial
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Aceitar licencas Android
        run: yes | sdkmanager --licenses || true
      - name: Criar projeto
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/plimclip/oficial
          mkdir -p app/src/main/res/values
          printf "include ':app'\n" > settings.gradle
          printf "plugins {\n id 'com.android.application' version '8.7.3' apply true\n}\nandroid {\n namespace 'com.plimclip.oficial'\n compileSdk 34\n defaultConfig { applicationId \"com.plimclip.oficial\"; minSdk 24; targetSdk 34; versionCode 6; versionName \"1.0\" }\n buildTypes { release { minifyEnabled false } }\n}\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }\n" > app/build.gradle
          printf "<?xml version=\"1.0\"?><manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><application android:label=\"Plim Clip\"><activity android:name=\".MainActivity\" android:exported=\"true\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          printf "package com.plimclip.oficial;\nimport android.os.Bundle;\nimport android.widget.TextView;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n protected void onCreate(Bundle b){ super.onCreate(b); TextView tv=new TextView(this); tv.setText(\"Plim Clip Oficial\"); setContentView(tv); }\n}\n" > app/src/main/java/com/plimclip/oficial/MainActivity.java
          echo '<resources><string name="app_name">Plim Clip</string></resources>' > app/src/main/res/values/strings.xml
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
      - name: Build AAB
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aab-oficial-play-console
          path: app/build/outputs/bundle/release/app-release.aab
