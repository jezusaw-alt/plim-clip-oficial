name: Build AAB Oficial
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build AAB
        run: |
          mkdir -p app/src/main/java/com/plimclip/oficial
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.plimclip.oficial'
            compileSdk 34
            defaultConfig {
              applicationId "com.plimclip.oficial"
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName "1.0"
            }
            signingConfigs {
              release {
                storeFile file('../../debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Plim Clip Oficial">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN
